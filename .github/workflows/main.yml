
name: Publish Nyimbo Ya Kutota Lesa PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract PWA package
        run: |
          set -euo pipefail
          if [ -f "NYIMBO_YA_KUTOTA_LESA_PWA_OPTIMIZED.zip" ]; then
            APP_ZIP="NYIMBO_YA_KUTOTA_LESA_PWA_OPTIMIZED.zip"
          elif [ -f "NYIMBO_YA_KUTOTA_LESA_PWA.zip" ]; then
            APP_ZIP="NYIMBO_YA_KUTOTA_LESA_PWA.zip"
          else
            echo "PWA ZIP package not found"
            exit 1
          fi

          mkdir -p extracted site
          unzip -q "$APP_ZIP" -d extracted
          INDEX_FILE="$(find extracted -type f -name index.html -print -quit)"

          if [ -z "$INDEX_FILE" ]; then
            echo "index.html not found"
            exit 1
          fi

          APP_DIR="$(dirname "$INDEX_FILE")"
          cp -a "$APP_DIR"/. site/
          test -f site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4